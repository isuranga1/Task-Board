<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Little steps board">
  <!--
    Three board columns, descending: To do / Doing / Done, in the same accent
    colours the app itself uses (the color-accent custom properties in
    src/index.css). Keep them in sync if that palette ever changes.

    Deliberately built from four solid shapes with no gradients, blurs or
    filters: a favicon is usually rasterised at 16px, where soft edges turn to
    mud. Bar width and gap are both large enough to survive that, which is why
    the columns are chunky rather than to-scale with the real board.

    Careful editing this comment: SVG is parsed as strict XML, and a double
    hyphen is illegal inside an XML comment. Writing the CSS variables out in
    their real form once made the whole file fail to parse, and the browser
    silently kept showing the OLD icon rather than reporting an error.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0b14"/>
  <rect x="5"  y="7" width="6" height="18" rx="3" fill="#7c8cff"/>
  <rect x="13" y="7" width="6" height="13" rx="3" fill="#ff9f6b"/>
  <rect x="21" y="7" width="6" height="8"  rx="3" fill="#4ee1a0"/>
</svg>
