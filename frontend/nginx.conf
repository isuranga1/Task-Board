server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by `tailscale serve` on the Pi (see DEPLOY.md §4.1),
    # which then forwards plain HTTP here on the loopback interface. That's
    # why this still listens on 80 and holds no certificate of its own.

    # The backend's own cap is MAX_UPLOAD_SIZE_MB (25 by default). Keep this
    # comfortably above it so an oversized file is rejected by the API with a
    # readable JSON 413, rather than by nginx with an HTML error page.
    client_max_body_size 30m;

    # The API lives behind the same origin as the app. This is load-bearing for
    # HTTPS, not just tidiness: a page served over https:// cannot fetch
    # http://<pi>:8000 — the browser blocks it as mixed content — and a second
    # origin would need its own certificate. Same origin also means the CORS
    # preflight never happens at all.
    #
    # The trailing slash on proxy_pass strips the /api prefix, so /api/tasks/1
    # arrives at the backend as /tasks/1 — matching the routes it declares.
    # Attachments ride the same path: the stored URL /uploads/<file> is
    # requested as /api/uploads/<file> and lands on the backend's static mount.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tailscale terminated TLS upstream of us, so tell the backend the
        # original scheme was https — otherwise anything it builds from the
        # request scheme comes out as http://.
        proxy_set_header X-Forwarded-Proto https;

        # The look-back and Grow orb wait on an LLM round-trip, which can
        # outlast nginx's 60s default and surface as a 504.
        proxy_read_timeout 120s;
    }

    # Single-page app: any path that isn't a real file falls back to
    # index.html so client-side navigation and hard refreshes both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
