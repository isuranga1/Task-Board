services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built from the same POSTGRES_* vars as the `db` service above —
      # deliberately NOT read from backend/.env, which is for native
      # (non-Docker) local dev and points at `localhost` instead of `db`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOADS_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REMINDER_TO_EMAIL: ${REMINDER_TO_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Where the OAuth callback sends the browser back to — the frontend's
      # origin. Falls back to CORS_ORIGINS' intent by defaulting to the same
      # host you serve the UI from; set it explicitly in .env.
      FRONTEND_URL: ${FRONTEND_URL:-}
      # The two LLM features — the Grow orb and the week/month/year look-back —
      # share one key. Blank = both show a "not configured" note and cost
      # nothing; the rest of the app is unaffected.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      GROWTH_DAILY_LIMIT: ${GROWTH_DAILY_LIMIT:-25}
      # Separate counter from the orb's, so a busy day of Grow clicks can't
      # leave you unable to write a weekly review.
      SUMMARY_DAILY_LIMIT: ${SUMMARY_DAILY_LIMIT:-10}
    volumes:
      - uploads:/app/uploads
    ports:
      # Loopback-only. The frontend container reaches the API over the compose
      # network (http://backend:8000), not through this mapping — this exists
      # solely so you can curl /health or open /docs while SSH'd into the Pi.
      # Binding it to 0.0.0.0 would republish the whole API over plain HTTP on
      # the tailnet, next to the HTTPS one, which defeats the point.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Also loopback-only: `tailscale serve` is what listens on the tailnet
      # and terminates TLS, then forwards here. Nothing should reach the app
      # over unencrypted HTTP. See DEPLOY.md §4.1.
      - "127.0.0.1:80:80"

volumes:
  pgdata:
  uploads:
